plugins {
    id 'com.android.application'
}
android {
    namespace 'tw.speedcam.app'
    compileSdk 34
    defaultConfig {
        applicationId 'tw.speedcam.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

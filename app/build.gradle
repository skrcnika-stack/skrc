plugins {
    id 'com.android.application'
}
android {
    namespace 'tw.speedcam.app'
    compileSdk 34
    defaultConfig {
        applicationId 'tw.speedcam.app'
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName '1.0.10'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

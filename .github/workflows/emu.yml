name: 模擬器測試
on:
  push:
  workflow_dispatch:
concurrency:
  group: emu-test
  cancel-in-progress: true
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, profile: pixel_6,     font: '1.0', name: redmi-size }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK and sign with a throwaway test key (same v1+v2 signing as the real release)
        run: |
          gradle assembleRelease --no-daemon
          pip install --quiet cryptography
          python3 .github/sign/apksign.py genkey /tmp/testkey
          python3 .github/sign/v1sign.py /tmp/testkey app/build/outputs/apk/release/app-release-unsigned.apk /tmp/v1.apk
          mkdir -p app/build/outputs/apk/debug
          python3 .github/sign/apksign.py sign /tmp/testkey /tmp/v1.apk app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: ${{ matrix.arch || 'x86_64' }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/emu_run.sh ${{ matrix.api }} ${{ matrix.font }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-${{ matrix.name }}
          path: emu_out

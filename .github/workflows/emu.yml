name: 模擬器測試
on:
  push:
  workflow_dispatch:
concurrency:
  group: emu-test
  cancel-in-progress: true
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, profile: pixel_6,     font: '1.0', name: redmi-size }
          - { api: 34, profile: small_phone, font: '1.0', name: small-360x640 }
          - { api: 34, profile: pixel_6,     font: '1.3', name: big-font }
          - { api: 29, profile: pixel_6,     font: '1.0', name: android10 }
          - { api: 23, profile: 'Nexus 5',    font: '1.0', name: android6, arch: x86, target: default }
          - { api: 36, profile: pixel_6,     font: '1.0', name: android16 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: ${{ matrix.arch || 'x86_64' }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/emu_run.sh ${{ matrix.api }} ${{ matrix.font }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-${{ matrix.name }}
          path: emu_out
